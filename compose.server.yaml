name: bible-talking

services:
  app:
    build: .
    image: bible-talking:local
    restart: unless-stopped
    init: true
    environment:
      DEPLOYMENT_MODE: server
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Run scripts/configure_server.py first}
      BIND_HOST: 0.0.0.0
      FORWARDED_ALLOW_IPS: "*"
      QDRANT_URL: http://qdrant:6333
      PRELOAD_BIBLE: "1"
    volumes:
      - app_data:/app/data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - vector_data:/qdrant/storage
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  app_data:
  vector_data:
